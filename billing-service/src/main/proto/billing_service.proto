syntax = "proto3";

option java_multiple_files = true;  //generate service request/respond files separate
option java_package = "billing";

//service
service BillingService {
  //a method inside billingService, accepts BillngRequest and returns BillingResponse
  rpc CreateBillingAccount(BillingRequest) returns (BillingResponse);
}

message BillingRequest {
  string patientId = 1;
  string name = 2;
  string email = 3;
}

message BillingResponse {
  string accountId = 1;
  string status = 2;
}